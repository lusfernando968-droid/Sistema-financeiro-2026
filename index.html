<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças Pessoais</title>
  <meta name="description" content="Sistema de gestão financeira pessoal com múltiplas carteiras, distribuição de faturamento e dashboard de análise.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;">
    <div style="width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #1abc9c;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <div style="margin-top:16px;font-weight:500;color:#666;">Conectando à nuvem...</div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
  </div>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">F</div>
        <span class="brand-name">Finanças</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#/dashboard" class="nav-item" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#/wallets" class="nav-item" data-page="wallets">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 7V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2v-2"/>
            <rect x="13" y="11" width="8" height="5" rx="1"/><circle cx="17" cy="13.5" r="1" fill="currentColor"/>
          </svg>
          <span>Carteiras</span>
        </a>
        <a href="#/credit" class="nav-item" data-page="credit">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="2" ry="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          <span>Crédito</span>
        </a>
        <a href="#/debts" class="nav-item" data-page="debts">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Dívidas</span>
        </a>
        <a href="#/transactions" class="nav-item" data-page="transactions">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Transações</span>
        </a>
        <a href="#/billing" class="nav-item" data-page="billing">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
          <span>Faturamento</span>
        </a>
        <a href="#/architecture" class="nav-item" data-page="architecture">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>
          </svg>
          <span>Arquitetura</span>
        </a>
        <a href="#/categories" class="nav-item" data-page="categories">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 6h16M4 10h10M4 14h7M4 18h5"/>
          </svg>
          <span>Categorias</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm sidebar-export-btn" onclick="DB.exportToExcel()" title="Exportar todos os dados para Excel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Exportar Excel
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-bar">
        <span id="page-title" class="page-title">Dashboard</span>
        <span class="current-date" id="current-date"></span>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="btn-icon" id="modal-close" title="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-overlay" class="modal-overlay" style="display:none">
    <div class="modal confirm-modal">
      <div class="modal-header">
        <h3 id="confirm-title">Confirmar</h3>
      </div>
      <div class="modal-body">
        <p id="confirm-message" style="font-size:14px;color:var(--text-secondary);line-height:1.6"></p>
        <div class="form-actions" style="margin-top:20px">
          <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
          <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation (mobile) -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="#/dashboard" class="bnav-item" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Visão</span>
    </a>
    <a href="#/wallets" class="bnav-item" data-page="wallets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M19 7V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2v-2"/>
        <rect x="13" y="11" width="8" height="5" rx="1"/><circle cx="17" cy="13.5" r="1" fill="currentColor"/>
      </svg>
      <span>Carteiras</span>
    </a>
    <div class="bnav-item bnav-center" id="fab-menu-toggle">
      <div class="bnav-fab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <span>Ação</span>
    </div>
    <a href="#/credit" class="bnav-item" data-page="credit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="5" width="20" height="14" rx="2" ry="2"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
      </svg>
      <span>Crédito</span>
    </a>
    <a href="#/debts" class="bnav-item" data-page="debts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      <span>Dívidas</span>
    </a>
  </nav>

  <!-- FAB Action Sheet (mobile) -->
  <div id="fab-overlay" class="fab-overlay" style="display:none">
    <div class="fab-menu">
      <a href="#/transactions" class="fab-menu-item">
        <span class="fab-menu-icon" style="color:var(--success)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="12 19 12 5"/><polyline points="5 12 12 5 19 12"/></svg></span>
        Nova Transação
      </a>
      <a href="#/billing" class="fab-menu-item">
        <span class="fab-menu-icon" style="color:var(--primary)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>
        Faturamento
      </a>
      <a href="#/architecture" class="fab-menu-item">
        <span class="fab-menu-icon" style="color:#8e44ad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg></span>
        Arquitetura Financeira
      </a>
      <a href="#/categories" class="fab-menu-item">
        <span class="fab-menu-icon" style="color:var(--text-secondary)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h10M4 14h7M4 18h5"/></svg></span>
        Categorias
      </a>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js?v=2"></script>
  <script src="js/utils.js?v=2"></script>
  <script src="js/pages/dashboard.js?v=2"></script>
  <script src="js/pages/wallets.js?v=2"></script>
  <script src="js/pages/credit.js?v=2"></script>
  <script src="js/pages/debts.js?v=2"></script>
  <script src="js/pages/transactions.js?v=2"></script>
  <script src="js/pages/billing.js?v=2"></script>
  <script src="js/pages/architecture.js?v=2"></script>
  <script src="js/pages/categories.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
